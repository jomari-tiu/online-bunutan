# Render Blueprint for the backend (server/).
# Render → New → Blueprint → pick this repo. It will ask for CORS_ORIGIN.
services:
  - type: web
    name: bunutan-server
    runtime: node
    rootDir: server
    plan: starter # a persistent disk needs a paid plan; on free, db.json is wiped on every restart
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_FILE
        value: /var/data/db.json
      - key: CORS_ORIGIN
        sync: false # your Vercel address, e.g. https://online-bunutan.vercel.app
    disk:
      name: bunutan-data
      mountPath: /var/data
      sizeGB: 1
