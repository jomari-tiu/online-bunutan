# Render Blueprint for the backend (server/).
# Render → New → Blueprint → pick this repo. It will ask for DATABASE_URL and CORS_ORIGIN.
# Data is saved in Postgres (Neon), so no disk is needed and the free plan works.
services:
  - type: web
    name: bunutan-server
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Neon connection string, typed in the Render dashboard
      - key: CORS_ORIGIN
        sync: false # your Vercel address, e.g. https://online-bunutan-xi.vercel.app
